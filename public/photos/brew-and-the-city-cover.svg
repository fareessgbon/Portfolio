<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A to-go coffee cup with steam rising, a small city skyline silhouette behind it, and a dotted route line to a map pin, Brew and the City">
  <defs>
    <linearGradient id="btcWall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#e6ddc8"/>
    </linearGradient>
    <radialGradient id="btcGlow2" cx="58%" cy="24%" r="65%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="btcShadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#241a15" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#btcWall2)"/>
  <rect width="640" height="480" fill="url(#btcGlow2)"/>

  <!-- city skyline, low and quiet -->
  <g fill="#9dbbd0" opacity="0.55">
    <rect x="60" y="330" width="26" height="90"/>
    <rect x="92" y="300" width="22" height="120"/>
    <rect x="120" y="344" width="30" height="76"/>
    <rect x="466" y="318" width="24" height="102"/>
    <rect x="496" y="350" width="28" height="70"/>
    <rect x="530" y="302" width="20" height="118"/>
  </g>
  <line x1="0" y1="420" x2="640" y2="420" stroke="#9dbbd0" stroke-width="1.4" opacity="0.5"/>

  <!-- dotted route to a pin -->
  <path d="M120,300 C220,340 280,220 340,200 C400,182 430,160 470,150" fill="none" stroke="#c9707f" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round" opacity="0.8"/>
  <g transform="translate(470,128)">
    <path d="M0,0 C-13,0 -22,9 -22,22 C-22,38 0,58 0,58 C0,58 22,38 22,22 C22,9 13,0 0,0 Z" fill="#c9707f"/>
    <circle cx="0" cy="21" r="8" fill="#fdfbf6"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(232,150)" filter="url(#btcShadow2)">
    <path d="M4,54 C-2,54 -4,58 -4,63 C-4,74 4,84 16,84 L152,84 C164,84 172,74 172,63 C172,58 170,54 164,54 Z" fill="none" stroke="#3a2c24" stroke-width="2" opacity="0.35"/>
    <path d="M10,54 L158,54 L148,206 C147,218 137,226 125,226 L43,226 C31,226 21,218 20,206 Z" fill="#f4efe4" stroke="#3a2c24" stroke-width="2"/>
    <rect x="8" y="42" width="152" height="18" rx="8" fill="#ebe4d5" stroke="#3a2c24" stroke-width="2"/>
    <rect x="20" y="118" width="128" height="46" rx="4" fill="#a15b3a" opacity="0.92"/>
    <text x="84" y="146" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#f4efe4">BREW</text>

    <!-- steam -->
    <g fill="none" stroke="#9a742d" stroke-width="2.4" stroke-linecap="round" opacity="0.65">
      <path d="M48,30 C40,18 56,10 48,-2 C42,-10 54,-20 48,-30"/>
      <path d="M92,30 C84,18 100,10 92,-2 C86,-10 98,-20 92,-30"/>
      <path d="M124,30 C116,18 132,10 124,-2 C118,-10 130,-20 124,-30"/>
    </g>
  </g>

  <text x="320" y="428" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#6b6259">BREW &amp; THE CITY</text>
  <text x="320" y="446" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#9a742d">CAFÉ DISCOVERY, MAPPED</text>
</svg>
