<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An open storybook on a table with a black wing rising from its spine and dotted branching paths connecting choice points, Black Wings Hackathon">
  <defs>
    <linearGradient id="bwWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="100%" stop-color="#e6ddc8"/>
    </linearGradient>
    <radialGradient id="bwGlow" cx="42%" cy="28%" r="62%">
      <stop offset="0%" stop-color="#fffdf6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fffdf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bwWing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2622"/>
      <stop offset="100%" stop-color="#100e0c"/>
    </linearGradient>
    <filter id="bwShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#241a15" flood-opacity="0.26"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#bwWall)"/>
  <rect width="640" height="480" fill="url(#bwGlow)"/>

  <!-- scattered highlight dots -->
  <g>
    <circle cx="80" cy="70" r="2.2" fill="#c9707f" opacity="0.7"/>
    <circle cx="540" cy="90" r="2" fill="#9a742d" opacity="0.55"/>
    <circle cx="96" cy="404" r="1.8" fill="#2b2622" opacity="0.22"/>
    <circle cx="558" cy="392" r="2.2" fill="#c9707f" opacity="0.6"/>
  </g>

  <!-- book -->
  <g transform="translate(160,268)" filter="url(#bwShadow)">
    <path d="M0,0 C50,-16 130,-16 180,0 L180,96 C130,80 50,80 0,96 Z" fill="#fbf8f2" stroke="#e2ddd0"/>
    <path d="M180,0 C230,-16 310,-16 360,0 L360,96 C310,80 230,80 180,96 Z" fill="#f3efe4" stroke="#e2ddd0"/>
    <line x1="180" y1="0" x2="180" y2="96" stroke="#d8d2c3" stroke-width="1.6"/>
    <g stroke="#cfc7b4" stroke-width="1">
      <line x1="24" y1="16" x2="150" y2="4"/>
      <line x1="24" y1="34" x2="150" y2="22"/>
      <line x1="24" y1="52" x2="150" y2="40"/>
      <line x1="210" y1="4" x2="336" y2="16"/>
      <line x1="210" y1="22" x2="336" y2="34"/>
      <line x1="210" y1="40" x2="336" y2="52"/>
    </g>
  </g>

  <!-- wing rising from the spine -->
  <g transform="translate(220,120) rotate(-6)" filter="url(#bwShadow)">
    <path d="M40,180 C10,140 -6,86 18,34 C34,60 30,96 40,120 C54,80 46,40 66,6 C80,44 72,84 78,118 C94,86 92,46 116,18 C122,58 108,98 96,132 C112,110 122,84 140,66 C136,104 112,138 82,160 C68,172 54,178 40,180 Z" fill="url(#bwWing)"/>
    <path d="M40,180 C10,140 -6,86 18,34" fill="none" stroke="#3a332c" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- branching decision paths -->
  <g fill="none" stroke="#9a742d" stroke-width="1.6" stroke-dasharray="3 5" opacity="0.85">
    <path d="M400,300 C440,280 460,260 486,236"/>
    <path d="M400,300 C440,320 466,330 498,320"/>
    <path d="M486,236 C500,222 512,214 526,206"/>
  </g>
  <g fill="#c9707f">
    <circle cx="400" cy="300" r="6"/>
    <circle cx="486" cy="236" r="5"/>
    <circle cx="498" cy="320" r="5"/>
    <circle cx="526" cy="206" r="4.5"/>
  </g>

  <text x="400" y="356" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#6b6259">BLACK WINGS</text>
  <text x="400" y="374" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#9a742d">CHOOSE YOUR PATH</text>
</svg>
