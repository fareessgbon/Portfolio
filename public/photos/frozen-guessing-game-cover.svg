<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A large snowflake with a small terminal window overlapping it, showing a guess prompt and a question mark, Character Guessing Game Frozen Edition">
  <defs>
    <linearGradient id="fgWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef6fa"/>
      <stop offset="100%" stop-color="#dbeaf1"/>
    </linearGradient>
    <radialGradient id="fgGlow" cx="46%" cy="30%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="fgShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1c3a4a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#fgWall)"/>
  <rect width="640" height="480" fill="url(#fgGlow)"/>

  <!-- snowflake -->
  <g transform="translate(300,240)" stroke="#7fb2c9" stroke-width="4" stroke-linecap="round" filter="url(#fgShadow)">
    <g id="fgArm">
      <line x1="0" y1="0" x2="0" y2="-140"/>
      <line x1="0" y1="-90" x2="-26" y2="-116"/>
      <line x1="0" y1="-90" x2="26" y2="-116"/>
      <line x1="0" y1="-50" x2="-22" y2="-70"/>
      <line x1="0" y1="-50" x2="22" y2="-70"/>
    </g>
    <use href="#fgArm" transform="rotate(60)"/>
    <use href="#fgArm" transform="rotate(120)"/>
    <use href="#fgArm" transform="rotate(180)"/>
    <use href="#fgArm" transform="rotate(240)"/>
    <use href="#fgArm" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="10" fill="#7fb2c9" stroke="none"/>
  </g>

  <!-- scattered small snow dots -->
  <g fill="#a8cede">
    <circle cx="120" cy="110" r="3"/>
    <circle cx="500" cy="130" r="2.4"/>
    <circle cx="150" cy="380" r="2.6"/>
    <circle cx="520" cy="360" r="3"/>
    <circle cx="90" cy="240" r="2"/>
  </g>

  <!-- terminal window -->
  <g transform="translate(356,260)" filter="url(#fgShadow)">
    <rect x="0" y="0" width="220" height="128" rx="10" fill="#1c2e38" stroke="#0f1d24"/>
    <circle cx="18" cy="18" r="4.5" fill="#e39a9a"/>
    <circle cx="34" cy="18" r="4.5" fill="#e8cf8f"/>
    <circle cx="50" cy="18" r="4.5" fill="#9adfb0"/>
    <text x="18" y="52" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#bcd8e2">&gt; guess_character()</text>
    <text x="18" y="76" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#7fb2c9">Is it Elsa?</text>
    <text x="182" y="106" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="26" fill="#e8cf8f">?</text>
  </g>

  <text x="320" y="432" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#3d5a68">FROZEN GUESSING GAME</text>
  <text x="320" y="450" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#7fb2c9">PYTHON &#183; Q&amp;A LOGIC</text>
</svg>
