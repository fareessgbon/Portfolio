<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A mobile coffee cart with an iced drink and a winding pink route line leading to a Mango Tree location pin, Drink Overflow pop-up campaign">
  <defs>
    <linearGradient id="ofWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ec"/>
      <stop offset="100%" stop-color="#f0e8d4"/>
    </linearGradient>
    <radialGradient id="ofGlow" cx="42%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ofShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#3a2c10" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#ofWall)"/>
  <rect width="640" height="480" fill="url(#ofGlow)"/>

  <!-- winding route: all roads lead to Mango Tree -->
  <path d="M60,380 C140,340 120,260 200,240 C280,220 260,140 340,120 C400,104 420,140 470,120" fill="none" stroke="#e8a9c0" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <path d="M60,380 C140,340 120,260 200,240 C280,220 260,140 340,120 C400,104 420,140 470,120" fill="none" stroke="#fff" stroke-width="1.6" stroke-dasharray="2 10" opacity="0.9"/>

  <g transform="translate(470,96)">
    <path d="M0,0 C-15,0 -25,10 -25,25 C-25,44 0,66 0,66 C0,66 25,44 25,25 C25,10 15,0 0,0 Z" fill="#f2c14e"/>
    <circle cx="0" cy="24" r="9" fill="#fffdf6"/>
  </g>

  <!-- coffee cart -->
  <g transform="translate(90,260)" filter="url(#ofShadow)">
    <rect x="0" y="40" width="160" height="80" rx="10" fill="#7fa876"/>
    <rect x="0" y="40" width="160" height="14" fill="#5c8a54"/>
    <circle cx="30" cy="132" r="16" fill="#3a2c10"/>
    <circle cx="130" cy="132" r="16" fill="#3a2c10"/>
    <rect x="-8" y="16" width="176" height="24" rx="6" fill="#f2c14e"/>
    <text x="80" y="33" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="9" letter-spacing="2" fill="#3a2c10">OVERFLOW</text>

    <!-- iced drink -->
    <g transform="translate(184,-24)" filter="url(#ofShadow)">
      <rect x="0" y="20" width="48" height="86" rx="8" fill="#eaf3d8" stroke="#7fa876" stroke-width="2"/>
      <rect x="4" y="60" width="40" height="42" fill="#c9e6b0" opacity="0.8"/>
      <rect x="16" y="-6" width="16" height="30" rx="6" fill="#f4efe0" stroke="#7fa876" stroke-width="1.4"/>
    </g>
  </g>

  <text x="320" y="428" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#6b5f3f">DRINK OVERFLOW</text>
  <text x="320" y="446" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#c9707f">ALL ROADS LEAD TO MANGO TREE</text>
</svg>
