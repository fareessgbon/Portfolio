<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A folded newsletter masthead reading Clinical Courier, resting above a stylised wave line and a small fish silhouette, Kerecis newsletter concept">
  <defs>
    <linearGradient id="kcWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef4f2"/>
      <stop offset="100%" stop-color="#dcebe8"/>
    </linearGradient>
    <radialGradient id="kcGlow" cx="42%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="kcShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0b2a2a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#kcWall)"/>
  <rect width="640" height="480" fill="url(#kcGlow)"/>

  <!-- waves -->
  <g fill="none" stroke="#2f8f86" stroke-width="2.4" opacity="0.4">
    <path d="M0,392 C60,376 100,408 160,392 C220,376 260,408 320,392 C380,376 420,408 480,392 C540,376 580,408 640,392"/>
    <path d="M0,414 C60,398 100,430 160,414 C220,398 260,430 320,414 C380,398 420,430 480,414 C540,398 580,430 640,414"/>
  </g>

  <!-- fish -->
  <g transform="translate(470,330) rotate(-8)" opacity="0.9">
    <path d="M0,0 C30,-22 66,-22 92,0 C66,22 30,22 0,0 Z" fill="#0b4a4a"/>
    <path d="M-6,0 L-30,-16 L-30,16 Z" fill="#0b4a4a"/>
    <circle cx="66" cy="-4" r="3" fill="#eef4f2"/>
  </g>

  <!-- folded newsletter -->
  <g transform="translate(160,110)" filter="url(#kcShadow)">
    <rect x="0" y="0" width="320" height="200" rx="4" fill="#fffefb" stroke="#bfe3de" stroke-width="1.6"/>
    <rect x="0" y="0" width="320" height="8" fill="#0b4a4a"/>
    <rect x="0" y="10" width="320" height="3" fill="#2f8f86"/>
    <text x="160" y="52" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#4a625f">Kerecis presents</text>
    <text x="160" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="36" fill="#0f2a28">Clinical Courier</text>
    <line x1="26" y1="112" x2="294" y2="112" stroke="#dfe9e7" stroke-width="1.4"/>
    <g stroke="#c7d9d6" stroke-width="1.2">
      <line x1="26" y1="136" x2="294" y2="136"/>
      <line x1="26" y1="154" x2="220" y2="154"/>
    </g>
    <rect x="26" y="172" width="70" height="14" rx="3" fill="#a5432f" opacity="0.85"/>
    <text x="61" y="182" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="7.5" fill="#fffefb">9.3 DAYS</text>
  </g>

  <text x="320" y="430" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#365551">CLINICAL COURIER</text>
  <text x="320" y="448" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#1f6e66">KERECIS &#183; NEWSLETTER SAMPLE</text>
</svg>
