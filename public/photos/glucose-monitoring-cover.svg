<svg viewBox="0 0 640 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A rounded glucose monitor screen reading 5.4 mmol per liter with a falling trend arrow, beside a blood glucose test droplet, Glucose Monitoring Prototype">
  <defs>
    <linearGradient id="gmWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f6ee"/>
      <stop offset="100%" stop-color="#e4ecd9"/>
    </linearGradient>
    <radialGradient id="gmGlow" cx="42%" cy="26%" r="62%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="gmShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#2c3a24" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="640" height="480" fill="url(#gmWall)"/>
  <rect width="640" height="480" fill="url(#gmGlow)"/>

  <g fill="#e39a9a" opacity="0.7">
    <circle cx="96" cy="96" r="2.4"/>
    <circle cx="540" cy="120" r="2"/>
    <circle cx="110" cy="392" r="2.2"/>
  </g>

  <!-- device -->
  <g transform="translate(208,90)" filter="url(#gmShadow)">
    <rect x="0" y="0" width="224" height="300" rx="28" fill="#fdfdfb" stroke="#cdd8c2" stroke-width="2"/>
    <rect x="18" y="26" width="188" height="150" rx="14" fill="#eef4e6"/>
    <text x="112" y="88" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="42" fill="#3d5a3a">5.4</text>
    <text x="112" y="114" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="1.5" fill="#7c8a6f">MMOL/L</text>
    <path d="M84,140 L100,152 L116,132 L132,148 L148,120" fill="none" stroke="#c9707f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M148,120 l-10,2 4,9 z" fill="#c9707f"/>
    <circle cx="112" cy="222" r="16" fill="#d8e3cb"/>
    <path d="M104,222 l6,6 12,-12" fill="none" stroke="#3d5a3a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="252" width="188" height="10" rx="5" fill="#e6edda"/>
    <rect x="18" y="270" width="140" height="10" rx="5" fill="#e6edda"/>
  </g>

  <!-- droplet -->
  <g transform="translate(452,240)" filter="url(#gmShadow)">
    <path d="M0,-70 C26,-30 46,0 46,26 C46,55 26,74 0,74 C-26,74 -46,55 -46,26 C-46,0 -26,-30 0,-70 Z" fill="#c9707f"/>
    <ellipse cx="-14" cy="10" rx="8" ry="14" fill="#e39a9a" opacity="0.7"/>
  </g>

  <text x="320" y="424" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="10" letter-spacing="2" fill="#546149">GLUCOSE MONITORING</text>
  <text x="320" y="442" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#8a9a5e">TREND, NOT JUST A NUMBER</text>
</svg>
